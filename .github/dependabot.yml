# Weekly dependency updates (idea from the Spir bot): one pull request per group,
# CI runs on each one, and you decide whether to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Baghdad
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node version the project runs on; raise it together with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: uv
    directory: /services/ig-worker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(worker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
