# Weekly scan for known vulnerabilities in the libraries we ship (idea from the Spir bot).
# A red run means: update the library it names.
name: Security audit

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
  push:
    paths: [pnpm-lock.yaml, services/ig-worker/uv.lock]
  pull_request:
    paths: [pnpm-lock.yaml, services/ig-worker/uv.lock]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Known vulnerabilities in production dependencies (high or critical)
        run: pnpm audit --prod --audit-level high

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ig-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Known vulnerabilities in the worker's dependencies
        run: uv export --locked --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --strict
