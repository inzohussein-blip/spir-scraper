<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>لا اتصال · Scrapers</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --fg: #14161f;
        --muted: #636a7d;
        --accent: #5b5bf7;
        --line: #e4e6ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d13;
          --card: #141721;
          --fg: #eceef4;
          --muted: #9aa1b3;
          --line: #262a37;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px 20px;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 19px;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 14.5px;
        line-height: 1.7;
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 10px 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        المنصة تحتاج الإنترنت لعرض بياناتك. مهامك وتشغيلاتك مستمرة على الخادم، ولن يضيع شيء.
        تعود الصفحة وحدها حين يعود الاتصال.
      </p>
      <button type="button" onclick="location.reload()">حاول مرة أخرى</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
