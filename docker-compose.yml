# Local development stack: Postgres and the Instaloader worker.
# The Node side (CLI / worker) runs on the host: pnpm scrapers ...
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scrapers
      POSTGRES_PASSWORD: scrapers
      POSTGRES_DB: scrapers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapers"]
      interval: 5s
      timeout: 3s
      retries: 10

  ig-worker:
    build: ./services/ig-worker
    environment:
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?set WORKER_SHARED_SECRET in .env}
      MIN_INTERVAL_SECONDS: ${MIN_INTERVAL_SECONDS:-3}
      PROXY_URLS: ${PROXY_URLS:-}
    # Bound to localhost only: the worker is never exposed publicly.
    ports:
      - "127.0.0.1:8000:8000"

  # Spir engine: reads accounts slowly and reports to the dashboard (outbound only, no port).
  # The same program also runs without Docker: python spir_worker.py (see docs/HOME-WORKER.md).
  # Start it with: docker compose --profile engine up -d ig-engine
  ig-engine:
    build: ./services/ig-worker
    command: ["python", "/app/spir_worker.py"]
    profiles: ["engine"]
    restart: unless-stopped
    environment:
      PLATFORM_URL: ${PLATFORM_URL:?set PLATFORM_URL in .env}
      SPIR_KEY: ${SPIR_KEY:-}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}
      PROXY_URLS: ${PROXY_URLS:-}
    volumes:
      - spir-engine:/home/worker

volumes:
  pgdata:
  spir-engine:
